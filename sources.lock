# sources.lock: every upstream source nextbsd-xlibs builds, pinned.
#
# One line per component:  <name> <version> <sha256> <url>
# <name> matches build_<name> in build-xlibs.sh (hyphens as underscores) and
# patches/<name>/. build-xlibs.sh downloads <url>, refuses it unless its
# SHA-256 is <sha256>, and unpacks it. Only upstream release tarballs (or tag
# archives) are listed: no FreeBSD packages or ports distfiles, no xsrc or
# xenocara. Bumping a version is a deliberate change to this file.
#
# xorg util-macros 1.20.2 is not listed: the toolchain image pins and installs
# it (nextbsd-toolchain#13), and it is a build tool only.

